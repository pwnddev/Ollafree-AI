[package]
name = "free-ollama"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ollafree-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
directories = "5.0"
eframe = { version = "0.29", features = ["default"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
